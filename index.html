<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE RADAR - NEXRAD Simulator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="game-layout">
        <!-- PAINEL LATERAL DE CONTROLES -->
        <div id="controls">
            <h2>Radar &amp; Atmosfera</h2>
            
            <div class="param">
                <label>Refletividade: <b id="lbl-dbz">45</b> dBZ</label>
                <input type="range" id="sl-dbz" min="0" max="75" value="45">
            </div>

            <div class="param">
                <label>Velocidade do Vento: <b id="lbl-vento">40</b> mph</label>
                <input type="range" id="sl-vento" min="0" max="120" value="40">
            </div>

            <div class="param">
                <label>Deslocamento do Sistema: <b id="lbl-desloc">25</b> mph</label>
                <input type="range" id="sl-desloc" min="5" max="65" value="25">
            </div>
            
            <div class="param">
                <label>Velocity Couplet (Rotação):</label>
                <select id="se-couplet">
                    <option value="0">Ausente</option>
                    <option value="1">Presente (Rotação Forte)</option>
                </select>
            </div>

            <!-- SELETORES DE PRODUTO DO RADAR -->
            <div class="param" style="margin-top: 15px;">
                <label>Selecionar Produto:</label>
                <div style="display: flex; gap: 5px; margin-top: 5px;">
                    <button id="btn-dbz" class="btn-product active" style="flex:1; padding:6px; background:#00ff00; color:#000; font-weight:bold; border:none; border-radius:4px; cursor:pointer;">Z (dBZ)</button>
                    <button id="btn-vento" class="btn-product" style="flex:1; padding:6px; background:#222; color:#fff; border:1px solid #444; border-radius:4px; cursor:pointer;">V (Vel)</button>
                    <button id="btn-cc" class="btn-product" style="flex:1; padding:6px; background:#222; color:#fff; border:1px solid #444; border-radius:4px; cursor:pointer;">CC</button>
                </div>
            </div>

            <div id="alerts-box">
                <h3>Alertas Ativos</h3>
                <div id="alerts-list">Monitorando atmosfera...</div>
            </div>
        </div>

        <!-- TELA ÚNICA DO RADAR -->
        <div id="visuals">
            <div class="screen">
                <h3 id="radar-title">Display Principal: Refletividade (dBZ)</h3>
                <canvas id="radarCanvas" width="450" height="450"></canvas>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
